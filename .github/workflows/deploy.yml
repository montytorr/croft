name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

# One deploy at a time. A second push mid-build would otherwise race the
# first for the same container name.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Only the commit `main` is on now deploys (CROFT-318). Each CI run on main
  # triggers a deploy of its own commit, and two pushes close together can
  # finish CI out of order: the older one's deploy then ran last and replaced
  # the newer build (v0.12.0's release commit was overwritten by its merge
  # commit this way). Runs are serialised by the concurrency group above, so
  # a superseded commit can simply stand down — the newer commit's own run
  # deploys it, before or after this one. If GitHub cannot be asked, it
  # deploys as it always did rather than deploying nothing.
  gate:
    # Only where the self-hosted runner exists. A mirror of this repository
    # (another organisation's copy, deploying its own way) would otherwise
    # queue this job forever waiting for a runner labelled `croft`.
    # Off until a host with a runner labelled `croft` exists: set the
    # repository variable CROFT_DEPLOY_ENABLED to `true` once it does. A job
    # skipped by its condition never waits for a runner; one without it
    # would queue after every green CI on main, forever.
    if: >-
      vars.CROFT_DEPLOY_ENABLED == 'true' &&
      github.repository == 'montytorr/croft' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, croft]
    timeout-minutes: 2
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          tip=$(curl -fsSL --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.sha" \
            "https://api.github.com/repos/$REPO/commits/main") || tip="$SHA"
          if [ "$tip" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is at ${tip:0:7}; ${SHA:0:7} is superseded, and the run for ${tip:0:7} deploys it"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.current == 'true'
    # Runs on the box it deploys to, so there is no registry and no secrets
    # in transit — the image is built where it runs.
    runs-on: [self-hosted, croft]
    timeout-minutes: 20
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: notify deploy start
        # Pushes and releases are announced by notify.yml; this says a deploy began.
        env:
          DISCORD_WEBHOOK: ${{ secrets.CROFT_DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_TEAM: ${{ secrets.CROFT_DISCORD_WEBHOOK_TEAM }}
        run: |
          set -uo pipefail
          short="${DEPLOY_SHA::7}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          message="🚀 **Croft deploy started** \`${short}\` · <${run_url}>"
          if [ -z "${DISCORD_WEBHOOK:-}${DISCORD_WEBHOOK_TEAM:-}" ]; then echo "::warning::no Discord webhook is set"; exit 0; fi
          # allowed_mentions: none, so a commit subject can never ping the channel.
          # Every configured channel: #croft, and the team's Discord.
          payload=$(jq -n --arg c "$message" '{content: $c, allowed_mentions: {parse: []}}')
          for hook in "${DISCORD_WEBHOOK:-}" "${DISCORD_WEBHOOK_TEAM:-}"; do
            [ -n "$hook" ] || continue
            printf '%s' "$payload" | curl -fsS -m 10 -H 'Content-Type: application/json' -d @- "$hook" >/dev/null \
              || echo "::warning::Discord start notification failed"
          done

      - name: link runtime configuration
        # Secrets live outside the workspace, owned by the runner user, and
        # are never checked out. The compose file reads .env.local for the
        # container and .env for label interpolation.
        env:
          CROFT_DOMAIN: ${{ vars.CROFT_DOMAIN }}
          CROFT_PROXY_NETWORK: ${{ vars.CROFT_PROXY_NETWORK }}
          CROFT_DATABASE_NETWORK: ${{ vars.CROFT_DATABASE_NETWORK }}
        run: |
          set -euo pipefail
          test -f "$HOME/croft-secrets/app.env" || { echo "missing app.env"; exit 1; }
          install -m 600 "$HOME/croft-secrets/app.env" .env.local
          # Required, not defaulted. A fallback here meant one person's
          # hostname and container names sat in a public file, and a fork that
          # forgot to configure them would deploy against names that are not
          # theirs — failing confusingly instead of immediately.
          : "${CROFT_DOMAIN:?set the CROFT_DOMAIN repository variable}"
          : "${CROFT_PROXY_NETWORK:?set the CROFT_PROXY_NETWORK repository variable}"
          : "${CROFT_DATABASE_NETWORK:?set the CROFT_DATABASE_NETWORK repository variable}"

          cat > .env <<ENV
          CROFT_DOMAIN=${CROFT_DOMAIN}
          CROFT_PROXY_NETWORK=${CROFT_PROXY_NETWORK}
          CROFT_DATABASE_NETWORK=${CROFT_DATABASE_NETWORK}
          GIT_SHA=${DEPLOY_SHA::7}
          ENV
          cp docker-compose.example.yml docker-compose.yml

      - name: note what is running
        id: previous
        # Captured BEFORE the build, because building overwrites the image tag
        # and leaves the old image dangling — reachable by id, and by nothing
        # else. Without this there is nothing to go back to.
        run: |
          image=$(docker inspect croft --format '{{.Image}}' 2>/dev/null || true)
          name=$(docker inspect croft --format '{{.Config.Image}}' 2>/dev/null || true)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "name=${name:-croft-croft}" >> "$GITHUB_OUTPUT"
          echo "currently running ${image:-nothing}"

      - name: build
        run: docker compose --profile tools build --quiet

      - name: migrate database
        run: docker compose --profile tools run --rm migrate

      - name: deploy
        run: docker compose up -d --remove-orphans

      - name: wait for health
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            state=$(docker inspect croft --format '{{.State.Health.Status}}' 2>/dev/null || echo starting)
            [ "$state" = "healthy" ] && { echo "healthy after ${i}0s"; exit 0; }
            sleep 10
          done
          echo "never became healthy"
          docker compose logs --tail=40 croft
          exit 1

      - name: smoke test
        # Through the public URL, so this exercises Traefik and TLS too — a
        # container that is healthy but unreachable is still a failed deploy.
        env:
          CROFT_DOMAIN: ${{ vars.CROFT_DOMAIN }}
        run: |
          set -euo pipefail
          # Retried: on a new domain the first request is what makes Traefik
          # ask Let's Encrypt, and curl fails TLS (exit 60) until it answers.
          code=000
          for _ in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${CROFT_DOMAIN}/api/v1/health" || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          [ "$code" = "200" ] || { echo "health endpoint returned $code"; exit 1; }
          echo "deployed $DEPLOY_SHA"

      - name: refresh the files agents read
        # TWO CLOCKS, and this is the one that was slow. The code is push-based
        # — this workflow — while the skill, the CLI and the hooks every agent
        # reads are pull-based, repaired by an hourly cron on this same box. So
        # after a merge that touches both there is a window where every agent on
        # every machine reads instructions that contradict the running code.
        # Measured 2026-09-21: merge 16:14, previous sync 15:23, 51 minutes, and
        # up to 59 in the general case. That day the sentence being contradicted
        # was the one the merge had just fixed (CROFT-257).
        #
        # The deploy runs on a self-hosted runner on the box the files live on,
        # so closing the window needs no webhook, no secret and no network hop:
        # run the job that already exists, now.
        #
        # THE HOURLY CRON STAYS. It is the fallback for a machine that was
        # powered off, a host this deploy cannot reach, and a merge that for any
        # reason never got here. A trigger added, not a schedule replaced — and
        # a repair reported by the cron now carries a second meaning worth
        # having: this step did not arrive.
        #
        # The command is read back out of the installed crontab rather than
        # written again here. Which copies this host has (`--also skill=…`) is a
        # fact about the host, lives in the line the installer wrote, and a
        # second copy of that list in this file is the next thing to drift —
        # the same failure as everything else in this batch.
        #
        # --source points at the tree that was just deployed, not the cron's
        # raw.githubusercontent URL: that URL is CDN-cached, so a fetch seconds
        # after the merge can be handed the previous main and write it back as
        # current. Drop the flag and the scheduled source is used unchanged.
        #
        # --no-notify because a repair is the EXPECTED outcome of this path. The
        # cron's note means "a runtime was reading a stale copy until now", and
        # one of those per merge would bury the ones that mean something.
        if: success()
        # A sync problem is not a deploy problem. Belt and braces, because the
        # rollback step below keys off job failure and must never see this one:
        # no `set -e`, every branch ends in a warning rather than an exit code,
        # and continue-on-error in case something still escapes.
        continue-on-error: true
        # The sync fetches and writes a dozen small files; three minutes is
        # generous. Without a bound of its own it would run into the job's
        # 20-minute timeout, and a job that times out is a job that failed —
        # which is the rollback step, over a file copy.
        timeout-minutes: 3
        run: |
          set -uo pipefail
          schedule=/opt/croft-maintenance/install-cron.mjs

          if [ ! -r "$schedule" ]; then
            echo "::warning::$schedule is not installed here — the hourly cron still covers this"
          elif ! grep -q -- '--run' "$schedule"; then
            # An installer predating --run treats an unknown flag as "print the
            # crontab" and exits 0, which would look exactly like a successful
            # sync. The hourly job repairs that copy of the installer itself, so
            # this branch is true at most once, on the deploy that ships it.
            echo "::warning::installed $schedule predates --run; the hourly cron will refresh it"
          else
            # -n rather than a bare sudo: on a box without the sudoers entry for
            # this exact command, fail immediately instead of waiting on a
            # password prompt no one is there to answer.
            sudo -n /usr/bin/node "$schedule" --run agent-files \
              --source "$GITHUB_WORKSPACE" --no-notify \
              || echo "::warning::agent file sync did not complete — the hourly cron will repair it"
          fi

      - name: roll back on failure
        if: failure()
        # This used to be `docker compose up -d --no-build` alone, which rolled
        # forward: the build step had already replaced the image tag, so the
        # "previous container" it started was the code that had just failed.
        # A migration failed, the rollback ran, and the new build went live
        # anyway while the job reported failure — the one state this exists to
        # prevent.
        run: |
          set -uo pipefail
          previous='${{ steps.previous.outputs.image }}'
          name='${{ steps.previous.outputs.name }}'

          if [ -z "$previous" ]; then
            echo "::error::deploy failed and nothing was running to fall back to"
            exit 1
          fi

          echo "deploy failed — restoring $previous"
          docker tag "$previous" "$name"
          docker compose up -d --no-build

          for _ in $(seq 1 18); do
            state=$(docker inspect croft --format '{{.State.Health.Status}}' 2>/dev/null || echo starting)
            if [ "$state" = healthy ]; then
              echo "rolled back to the previous build, healthy"
              exit 1   # the deploy still failed; say so
            fi
            sleep 5
          done

          echo "::error::rollback did not become healthy — the site may be down"
          exit 1

      - name: notify deploy result
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
          CROFT_DOMAIN: ${{ vars.CROFT_DOMAIN }}
          DISCORD_WEBHOOK: ${{ secrets.CROFT_DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_TEAM: ${{ secrets.CROFT_DISCORD_WEBHOOK_TEAM }}
        run: |
          set -u
          short="${DEPLOY_SHA::7}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          case "$DEPLOY_STATUS" in
            success) message="✅ **Croft deployed** \`${short}\` · healthy and smoke-tested · <https://${CROFT_DOMAIN}> · <${run_url}>" ;;
            cancelled) message="⚠️ **Croft deploy cancelled** \`${short}\` · <${run_url}>" ;;
            *) message="❌ **Croft deploy failed** \`${short}\` · rollback attempted · <${run_url}>" ;;
          esac
          if [ -z "${DISCORD_WEBHOOK:-}${DISCORD_WEBHOOK_TEAM:-}" ]; then echo "::warning::no Discord webhook is set"; exit 0; fi
          # Every configured channel: #croft, and the team's Discord.
          payload=$(jq -n --arg c "$message" '{content: $c, allowed_mentions: {parse: []}}')
          for hook in "${DISCORD_WEBHOOK:-}" "${DISCORD_WEBHOOK_TEAM:-}"; do
            [ -n "$hook" ] || continue
            printf '%s' "$payload" | curl -fsS -m 10 -H 'Content-Type: application/json' -d @- "$hook" >/dev/null \
              || echo "::warning::Discord result notification failed"
          done
